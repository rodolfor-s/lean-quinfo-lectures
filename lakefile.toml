name = "qic891"
version = "0.1.0"
keywords = ["math", "quantum-information", "lectures"]
defaultTargets = ["QIC891"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "verso-slides"
scope = "leanprover"
rev = "v4.33.0"

[[require]]
name = "quantumInfo"
git = "https://github.com/Timeroot/Lean-QuantumInfo"
rev = "main"

[[require]]
name = "Physlib"
git = "https://github.com/leanprover-community/physlib"
rev = "v4.33.0"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "QIC891"

# Added so changes to `custom.css` alone
# are perceived and relevant during build time
#
[[input_file]] # declares lake input file targets
name = "custom_css"
path = "QIC891/_assets/custom.css"
text = true

[[lean_exe]]
name = "qic891"
root = "Main"
needs =["@/custom_css"] # uses `name` variable of input files
