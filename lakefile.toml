name = "qic891"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["QIC891"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "verso-slides"
scope = "leanprover"
rev = "v4.33.0"

[[require]]
name = "quantumInfo"
git = "https://github.com/Timeroot/Lean-QuantumInfo"
rev = "main"

[[require]]
name = "Physlib"
git = "https://github.com/leanprover-community/physlib"
rev = "v4.33.0"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "QIC891"

[[lean_exe]]
name = "qic891"
root = "Main"
