name: Create Release

on:
  push:
    branches:
      - 'main'
      - 'master'
    paths:
      - 'lean-toolchain'

jobs:
  lean-release-tag:
    name: Add Lean release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: lean-release-tag action
      uses: leanprover-community/lean-release-tag@v1
      with:
        # Create the tag only, without a GitHub release. Zenodo makes a new
        # DOI version for every GitHub release, so toolchain bumps must not
        # publish one; course releases are made by hand instead.
        do-release: false
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
