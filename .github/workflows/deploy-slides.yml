name: Build and Deploy Slides

on:
  # Only run when something that feeds the slide build changes
  # (not, e.g., `README.md` or `syllabus.tex`).
  push:
    branches: [main]
    paths:
      - QIC891/** # lecture sources and `_assets/`
      - Main.lean # deck list and config
      - QIC891.lean
      - lakefile.toml
      - lake-manifest.json
      - lean-toolchain
      - .github/workflows/deploy-slides.yml
  pull_request:
    paths:
      - QIC891/**
      - Main.lean
      - QIC891.lean
      - lakefile.toml
      - lake-manifest.json
      - lean-toolchain
      - .github/workflows/deploy-slides.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a newer push cancels an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build Verso slide decks
        run: lake exe qic891
      - name: Generate homepage
        run: |
          css="$(cat QIC891/_assets/listing.css)"
          {
            echo '<!DOCTYPE html>'
            echo '<html lang="en">'
            echo '<head>'
            echo '<meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>QIC891 Lecture Slides, Fall 2026</title>'
            echo "<style>${css}</style>"
            echo '</head>'
            echo '<body>'
            echo '<main>'
            echo '<h1><span class="label">QIC891</span>Lecture Slides</h1>'
            echo '<ul>'
            for dir in _slides/*/; do
              name="$(basename "$dir")"
              if [ -f "${dir}index.html" ]; then
                label="$(echo "$name" | sed -E 's/^lecture([0-9]+)$/Lecture \1/; s/-/ /g' \
                  | awk '{for (i = 1; i <= NF; i++) $i = toupper(substr($i, 1, 1)) substr($i, 2)}1')"
                echo "<li class=\"dir\"><a href=\"${name}/\">${label}</a></li>"
              fi
            done
            echo '</ul>'
            echo '</main>'
            echo '</body>'
            echo '</html>'
          } > _slides/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _slides

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
