name: Build and Deploy Slides

on:
  # Only run when something that feeds the slide build changes
  # (not, e.g., `README.md`).
  push:
    branches: [main]
    paths:
      - QIC891/** # lecture sources and `_assets/`
      - Main.lean # deck list and config
      - QIC891.lean
      - lakefile.toml
      - lake-manifest.json
      - lean-toolchain
      - .github/workflows/deploy-slides.yml
      - .github/scripts/generate-index-page.sh
      - .github/scripts/assets/**
  pull_request:
    paths:
      - QIC891/**
      - Main.lean
      - QIC891.lean
      - lakefile.toml
      - lake-manifest.json
      - lean-toolchain
      - .github/workflows/deploy-slides.yml
      - .github/scripts/generate-index-page.sh
      - .github/scripts/assets/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a newer push cancels an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build Verso slide decks
        run: lake exe qic891
      - name: Generate index page
        run: .github/scripts/generate-index-page.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _slides

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
